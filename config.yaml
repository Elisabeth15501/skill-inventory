# 天禧 AI 技能广场提交清单（config.yaml）
#
# ✅ 2026-10-01 官方渠道核实结论（上传指南 doc id=2056218595550924802，更新于 2026-06-05）：
#   1. 官方上传路径是「ZIP ≤10MB + SKILL.md 必须在 ZIP 根目录」，平台自动读取包内信息回填；
#      CLI 上传走 lenovoskill（init/package/push），CLI 另读项目级 .skill-config.json（私有适配层，勿 commit）。
#   2. 官方文档 **未出现 config.yaml，也没有 network/permissions schema** ——
#      本文件的字段是 2026-09-26 按「假设 schema」写的，并非官方要求。
#   3. 社区实测（skill-publish-sync 经验）：联想 CLI 从 SKILL.md frontmatter 读 slug + displayName
#      （SKILL.md 已补这两个字段），与 .skill-config.json 并存、应保持一致。
# 结论：本 config.yaml **不是上传必需文件**，仅作平台适配信息留档；打 ZIP 上传时可不包含，
#       若后续官方公开 schema 或 CLI 报缺字段，再按报错补齐。
name: skill-inventory
version: 1.3.4
author: Elisabeth15501
description: >-
  面向办公型 Agent（如 WorkBuddy）的技能库盘点与效能体检。扫描技能目录，统计数量 / 体积 /
  上下文 token 占用，识别重复与近似技能，并给出保守的瘦身建议。仅输出建议，不代用户关闭任何技能——关闭动作需用户显式授权（--apply --yes）。
license: MIT
categories:
  - 效率工具
  - 办公生产力
# 红线：天禧沙箱禁止出站网络。本技能为纯本地静态分析，无任何网络依赖。
network:
  outbound: false
# 仅读取技能目录与用量日志；不写、不改宿主配置（除非用户显式 --apply 并确认）。
permissions:
  filesystem: read-only
